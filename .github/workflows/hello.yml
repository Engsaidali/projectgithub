name: Hello Workflow

on:
  push:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count files
        run: |
          COUNT=$(find . -path ./.git -prune -o -type f -print | wc -l)
          echo "FILES=$COUNT" >> $GITHUB_ENV

      - name: Greet Student
        run: |
          echo "Hello ${{ vars.STUDENT_NAME }}, your files count are $FILES"