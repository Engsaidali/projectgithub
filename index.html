<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website-kayga</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header{
            background-color: darkblue;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav{
            background-color: #333;
            padding: 10px;
            text-align: center;
        }

        nav a{
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        nav a:hover{
            color: yellow;
        }

        .container{
            width: 80%;
            margin: auto;
            padding: 20px;
        }

        .card{
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        img{
            width: 250px;
            border-radius: 10px;
        }

        button{
            background-color: green;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 5px;
        
        }

    
    
    </style>
</head>


</html>
